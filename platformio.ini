[platformio]
default_envs = sensor_test
src_dir = src
; Keep generated files in a short ASCII path.
; This avoids Windows path-length errors while unpacking SimpleFOC examples.
build_dir = ${sysenv.USERPROFILE}/.pio/esp32-bldc/build
libdeps_dir = ${sysenv.USERPROFILE}/.pio/esp32-bldc/libdeps

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Show typed commands locally and send them as a complete line on Enter.
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
upload_speed = 921600
lib_archive = false
lib_deps =
    ; SimpleFOC 2.3.4+ requires Arduino-ESP32 3.x/ESP-IDF 5.x.
    ; Pin 2.3.3 for PlatformIO's stable ESP32 Arduino 2.x framework.
    askuric/Simple FOC@2.3.3

[env:sensor_test]
extends = common
build_src_filter =
    -<*>
    +<sensor_test.cpp>

[env:openloop_test]
extends = common
build_src_filter =
    -<*>
    +<openloop_test.cpp>

[env:closedloop_velocity_test]
extends = common
build_src_filter =
    -<*>
    +<closedloop_velocity_test.cpp>

; New assignment versions. Select the matching _new environment to build/upload.
; Original environments and the default sensor_test remain available.
[env:sensor_test_new]
extends = common
build_src_filter =
    -<*>
    +<sensor_test_new.cpp>

[env:openloop_test_new]
extends = common
build_src_filter =
    -<*>
    +<openloop_test_new.cpp>

[env:closedloop_velocity_test_new]
extends = common
build_src_filter =
    -<*>
    +<closedloop_velocity_test_new.cpp>

; Two-wheel balance controller adapted from the upstream mcdgf balance example.
[env:balance_car_new]
extends = common
platform = espressif32@7.1.3
; Single-character stop is sent immediately in this environment.
monitor_filters =
build_src_filter =
    -<*>
    +<balance_car_new.cpp>

; Motor identification homework: 4.1 driver calibration.
[env:driver_calibration]
extends = common
build_src_filter =
    -<*>
    +<driver_calibration.cpp>

; Motor identification homework: 4.2 equivalent duty/Ua steps and 1 ms CSV.
[env:identification_step]
extends = common
monitor_speed = 921600
; Keep send-on-enter for S/X and save the complete acquisition automatically.
monitor_filters =
    send_on_enter
    log2file
build_src_filter =
    -<*>
    +<identification_step.cpp>
